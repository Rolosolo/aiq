# Coralfil OS — Ocean Research Assistant
#
# CPU-only, resource-light configuration.
# Uses NVIDIA-hosted inference (no local GPU required).
#
# Pipeline:
#   User query → Intent classifier → Shallow/Deep researcher
#     → Tavily web search + Serper paper search
#     → Knowledge layer (LlamaIndex, local vector store)
#     → Article index (parsed_articles.json)
#     → Structured output for formulation ML pipeline
#
# Run:
#   dotenv -f deploy/.env run nat run \
#     --config_file configs/config_coralfil_research.yml \
#     --input "chitosan pellet formulation for Acropora cervicornis thermal stress"

general:
  telemetry:
    logging:
      console:
        _type: console
        level: INFO

llms:
  # Intent classifier — lightweight, fast
  intent_llm:
    _type: nim
    model_name: nvidia/nemotron-3-nano-30b-a3b
    base_url: "https://integrate.api.nvidia.com/v1"
    temperature: 0.3
    top_p: 0.9
    max_tokens: 1024
    num_retries: 5
    chat_template_kwargs:
      enable_thinking: true

  # Research agent — balanced quality/speed
  researcher_llm:
    _type: nim
    model_name: nvidia/nemotron-3-nano-30b-a3b
    base_url: "https://integrate.api.nvidia.com/v1"
    temperature: 0.5
    top_p: 0.9
    max_tokens: 4096
    num_retries: 5
    chat_template_kwargs:
      enable_thinking: false

  # Deep research orchestrator — highest quality
  orchestrator_llm:
    _type: nim
    model_name: openai/gpt-oss-120b
    base_url: https://integrate.api.nvidia.com/v1
    temperature: 1.0
    top_p: 1.0
    max_tokens: 128000
    api_key: ${NVIDIA_API_KEY}
    max_retries: 10

functions:
  # --- Web Search (Tavily) ---
  web_search:
    _type: tavily_web_search
    max_results: 5
    max_content_length: 1500

  deep_web_search:
    _type: tavily_web_search
    max_results: 3
    advanced_search: true
    max_content_length: 3000

  # --- Academic Paper Search (Serper / Google Scholar) ---
  paper_search:
    _type: paper_search
    max_results: 8
    serper_api_key: ${SERPER_API_KEY}

  # --- Knowledge Layer (LlamaIndex, local CPU vector store) ---
  # Reads from the parsed article index at:
  #   nvidia_ingestion/ocean_article_index.json
  knowledge_retrieval:
    _type: llamaindex_knowledge_layer
    # Local embedding — no GPU required
    embedding_model: nvidia/llama-nemotron-embed-vl-1b-v2
    embedding_base_url: "https://integrate.api.nvidia.com/v1"
    # Local vector store persisted to disk
    vector_store_path: "../nvidia_ingestion/vector_store"
    index_name: "coralfil-ocean-research"
    top_k: 6
    similarity_threshold: 0.65

  # --- Intent Classifier ---
  intent_classifier:
    _type: intent_classifier
    llm: intent_llm
    tools:
      - web_search
      - paper_search
      - knowledge_retrieval

  # --- Clarifier (asks user to refine vague queries) ---
  clarifier_agent:
    _type: clarifier_agent
    llm: researcher_llm
    planner_llm: researcher_llm
    tools:
      - web_search
      - knowledge_retrieval
    max_turns: 2
    enable_plan_approval: false
    verbose: true

  # --- Shallow Researcher (fast, bounded) ---
  shallow_research_agent:
    _type: shallow_research_agent
    llm: researcher_llm
    tools:
      - web_search
      - paper_search
      - knowledge_retrieval
    max_llm_turns: 8
    max_tool_iterations: 4

  # --- Deep Researcher (slow, thorough — CPU-friendly) ---
  deep_research_agent:
    _type: deep_research_agent
    orchestrator_llm: orchestrator_llm
    researcher_llm: researcher_llm
    planner_llm: orchestrator_llm
    # Fewer loops = lower CPU/memory pressure
    max_loops: 2
    tools:
      - deep_web_search
      - paper_search
      - knowledge_retrieval

workflow:
  _type: chat_deepresearcher_agent
  enable_escalation: true
  enable_clarifier: true
  checkpoint_db: ${AIQ_CHECKPOINT_DB:-../nvidia_ingestion/checkpoints.db}
